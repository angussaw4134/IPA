name: Build SideStore IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      website_url:
        description: Website to open (HTTPS, no path)
        required: true
        default: https://3377test.erg3be.workers.dev/
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      WEBSITE_URL: ${{ inputs.website_url || 'https://3377test.erg3be.workers.dev/' }}
    steps:
      - uses: actions/checkout@v6
      - name: Check build configuration
        run: python3 -m unittest discover -s tests -v
      - name: Check native login integration
        run: node --test tests/*.mjs
      - name: Exercise WebKit startup rule compiler
        run: |
          mkdir -p build
          swiftc App/NativeContentRules.swift tests/content-rules.swift -o build/check-content-rules
          build/check-content-rules
      - name: Check navigation and authentication request policy
        run: |
          swiftc App/NativeAccessPolicy.swift tests/access-policy.swift -o build/check-access-policy
          python3 tests/auth-redirect.py build/check-access-policy
      - name: Check encrypted reinstall recovery
        run: |
          swiftc App/WebsiteStateVault.swift tests/website-vault.swift -o build/check-website-vault
          build/check-website-vault
      - name: Compile iPhone app and package IPA
        run: bash scripts/build-ipa.sh
      - name: Downloadable SideStore app
        uses: actions/upload-artifact@v7
        with:
          name: AccessHubTest-SideStore
          path: |
            dist/AccessHubTest.ipa
            dist/AccessHubTest.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Xcode-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
